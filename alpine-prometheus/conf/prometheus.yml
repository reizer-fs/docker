global:
  scrape_interval:      1m
  evaluation_interval:  1s

scrape_configs:
- job_name: 'prometheus'
  scrape_interval: 5s
  static_configs:
  - targets: ['localhost:9090']

- job_name: collectd
  scrape_interval: 10s
  honor_timestamps: true
  static_configs:
  - targets: ['10.11.12.1:9103']

- job_name: 'libvirt'
  scrape_interval: 5s
  static_configs:
  - targets: ['10.11.12.1:9177']
